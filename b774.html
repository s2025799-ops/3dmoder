<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>シン・ホシノ | 特殊観測機 B774 3DCG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #030508; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; user-select: none; }
    canvas { display: block; }

    /* 映画風の黒帯（シネマスコープ） */
    .letterbox-top, .letterbox-bottom {
      position: fixed; left: 0; width: 100%; height: 9vh;
      background: #000; z-index: 10; pointer-events: none;
    }
    .letterbox-top { top: 0; }
    .letterbox-bottom { bottom: 0; }

    /* 特撮映画風データオーバーレイ */
    #hud {
      position: fixed; bottom: 11vh; left: 24px; z-index: 20;
      color: #e2e8f0; pointer-events: none; transition: opacity 0.3s;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    #hud .tag {
      display: inline-block; background: #b91c1c; color: #fff;
      font-size: 11px; font-weight: bold; padding: 2px 8px; letter-spacing: 0.15em; margin-bottom: 6px;
    }
    #hud h1 { font-size: clamp(18px, 3vw, 26px); letter-spacing: 0.12em; font-weight: 900; }
    #hud p { font-size: 12px; color: #94a3b8; letter-spacing: 0.1em; margin-top: 4px; font-family: monospace; }

    /* 録画用UI非表示ボタン */
    #toggle-ui {
      position: fixed; top: 11vh; right: 20px; z-index: 30;
      background: rgba(15, 23, 42, 0.7); color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 6px 12px; font-size: 11px; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="letterbox-top"></div>
  <div class="letterbox-bottom"></div>

  <div id="hud">
    <div class="tag">特殊観測機 ／ おとり作戦展開中</div>
    <h1>B774（B777急改造仕様）</h1>
    <p id="cam-label">CAM 01: 海面低空ローアングル（画面タップで視点切替）</p>
  </div>

  <button id="toggle-ui" onclick="toggleHud(event)">UI表示切替（録画用）</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. シーン・レンダラー設定（影と高精細ピクセル比を有効化）
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04070d);
    scene.fog = new THREE.FogExp2(0x060b14, 0.0085);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // 2. ドラマチックな映画ライティング
    const hemiLight = new THREE.HemisphereLight(0x3b5998, 0x090d16, 0.9);
    scene.add(hemiLight);

    // 月明かり（メインの強い斜め光）
    const moonLight = new THREE.DirectionalLight(0xcce0ff, 2.2);
    moonLight.position.set(30, 50, 25);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 1024;
    moonLight.shadow.mapSize.height = 1024;
    scene.add(moonLight);

    // 前方からの不穏な赤い照り返し（ゴジラの背びれ発光・都市火災イメージ）
    const redGlow = new THREE.PointLight(0xff2a1a, 3.5, 90);
    redGlow.position.set(-15, 6, 35);
    scene.add(redGlow);

    // 3. プログラム生成テクスチャ（迷彩・パネルライン・B774ロゴ）
    function createFuselageTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // ベース塗装（自衛隊・特殊部隊風のダークオリーブグレー）
      ctx.fillStyle = '#2d332c';
      ctx.fillRect(0, 0, 1024, 1024);

      // 迷彩パターン
      ctx.fillStyle = '#1f241f';
      for (let i = 0; i < 45; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random() * 1024, Math.random() * 1024, 60 + Math.random() * 90, 30 + Math.random() * 60, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }

      // 機体のパネルライン（継ぎ目）
      ctx.strokeStyle = 'rgba(10, 12, 10, 0.5)';
      ctx.lineWidth = 2;
      for (let y = 0; y < 1024; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      for (let x = 0; x < 1024; x += 128) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
      }

      // 識別用の赤い警告ストライプ
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(0, 320, 1024, 14);

      // 機体番号「B774」を左右側面に描画
      ctx.save();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 42px sans-serif';
      // 右側面
      ctx.translate(256, 460);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('B774  HOSHINO-DEF', -160, 0);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 42px sans-serif';
      // 左側面
      ctx.translate(768, 460);
      ctx.rotate(Math.PI / 2);
      ctx.fillText('B774  HOSHINO-DEF', -160, 0);
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      return tex;
    }

    const fuselageTex = createFuselageTexture();
    const bodyMat = new THREE.MeshStandardMaterial({
      map: fuselageTex,
      roughness: 0.45,
      metalness: 0.35
    });
    const wingMat = new THREE.MeshStandardMaterial({
      color: 0x262b26,
      roughness: 0.4,
      metalness: 0.45
    });
    const darkMetalMat = new THREE.MeshStandardMaterial({
      color: 0x14171c,
      roughness: 0.25,
      metalness: 0.85
    });

    // 4. B774 精密モデルの構築
    const plane = new THREE.Group();

    // 胴体メイン
    const fuselageGeo = new THREE.CylinderGeometry(1.15, 1.15, 15, 32);
    fuselageGeo.rotateX(Math.PI / 2);
    const fuselage = new THREE.Mesh(fuselageGeo, bodyMat);
    fuselage.castShadow = true;
    plane.add(fuselage);

    // 流線型機首（LatheGeometryで滑らかなノーズを形成）
    const nosePoints = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      const r = Math.sin(t * Math.PI * 0.5) * 1.15;
      const y = (1 - Math.cos(t * Math.PI * 0.5)) * 4.2;
      nosePoints.push(new THREE.Vector2(r, -y));
    }
    const noseGeo = new THREE.LatheGeometry(nosePoints, 32);
    noseGeo.rotateX(-Math.PI / 2);
    noseGeo.translate(0, 0, 11.7);
    const nose = new THREE.Mesh(noseGeo, wingMat);
    nose.castShadow = true;
    plane.add(nose);

    // コックピット窓（反射するガラス）
    const cockpitGeo = new THREE.SphereGeometry(1.06, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.35);
    cockpitGeo.rotateX(Math.PI * 0.42);
    cockpitGeo.scale(1.02, 0.85, 1.4);
    const cockpitMat = new THREE.MeshPhysicalMaterial({ color: 0x050a14, roughness: 0.05, metalness: 0.9, clearcoat: 1.0 });
    const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
    cockpit.position.set(0, 0.35, 8.2);
    plane.add(cockpit);

    // 後部テールコーン（先細り）
    const tailConeGeo = new THREE.CylinderGeometry(1.15, 0.35, 5.5, 32);
    tailConeGeo.rotateX(Math.PI / 2);
    tailConeGeo.translate(0, 0.25, -10.25);
    const tailCone = new THREE.Mesh(tailConeGeo, wingMat);
    plane.add(tailCone);

    // 後退翼を作るヘルパー関数（ExtrudeGeometry）
    function createSweptWing(span, rootChord, tipChord, sweepBack, thickness) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(span, -sweepBack);
      shape.lineTo(span, -sweepBack - tipChord);
      shape.lineTo(0, -rootChord);
      shape.closePath();

      const extrudeSettings = { steps: 1, depth: thickness, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(-Math.PI / 2);
      return geo;
    }

    // 主翼（左右対称の後退翼＋上反角）
    const rightWingGeo = createSweptWing(11.5, 4.2, 1.1, 4.8, 0.18);
    const rightWing = new THREE.Mesh(rightWingGeo, wingMat);
    rightWing.position.set(0.9, -0.3, 2.5);
    rightWing.rotation.z = 0.06; // 上反角
    rightWing.castShadow = true;
    plane.add(rightWing);

    const leftWing = rightWing.clone();
    leftWing.scale.x = -1;
    leftWing.position.set(-0.9, -0.3, 2.5);
    leftWing.rotation.z = -0.06;
    plane.add(leftWing);

    // 水平尾翼（左右）
    const rightHTail = new THREE.Mesh(createSweptWing(4.2, 2.0, 0.6, 1.8, 0.1), wingMat);
    rightHTail.position.set(0.3, 0.3, -9.8);
    plane.add(rightHTail);

    const leftHTail = rightHTail.clone();
    leftHTail.scale.x = -1;
    leftHTail.position.set(-0.3, 0.3, -9.8);
    plane.add(leftHTail);

    // 垂直尾翼
    const vTailShape = new THREE.Shape();
    vTailShape.moveTo(0, 0);
    vTailShape.lineTo(-2.5, 4.2);
    vTailShape.lineTo(-3.6, 4.2);
    vTailShape.lineTo(-2.8, 0);
    vTailShape.closePath();
    const vTailGeo = new THREE.ExtrudeGeometry(vTailShape, { depth: 0.14, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03 });
    vTailGeo.rotateY(Math.PI / 2);
    const vTail = new THREE.Mesh(vTailGeo, wingMat);
    vTail.position.set(-0.07, 0.8, -8.8);
    plane.add(vTail);

    // B777特徴の大型双発エンジン（中空ナセル＋回転ファン＋噴射グロー）
    const fans = [];
    function createEngine(x, y, z) {
      const engGroup = new THREE.Group();
      // 外筒
      const cowlGeo = new THREE.CylinderGeometry(0.88, 0.82, 3.2, 28, 1, true);
      cowlGeo.rotateX(Math.PI / 2);
      const cowlMat = new THREE.MeshStandardMaterial({ color: 0x1e2229, roughness: 0.3, metalness: 0.8, side: THREE.DoubleSide });
      const cowl = new THREE.Mesh(cowlGeo, cowlMat);
      engGroup.add(cowl);

      // 銀色のインテークリング
      const ringGeo = new THREE.TorusGeometry(0.86, 0.06, 12, 28);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.2, metalness: 0.95 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.z = 1.6;
      engGroup.add(ring);

      // 回転タービンファン
      const fanGroup = new THREE.Group();
      const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 16), darkMetalMat);
      spinner.rotation.x = Math.PI / 2;
      spinner.position.z = 1.3;
      fanGroup.add(spinner);

      for (let i = 0; i < 12; i++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.75, 0.03), darkMetalMat);
        blade.rotation.z = (i / 12) * Math.PI * 2;
        blade.rotation.y = 0.4;
        blade.position.z = 1.1;
        fanGroup.add(blade);
      }
      engGroup.add(fanGroup);
      fans.push(fanGroup);

      // 後部排気グロー（高温のオレンジ光）
      const exhaust = new THREE.Mesh(
        new THREE.CircleGeometry(0.65, 20),
        new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.65 })
      );
      exhaust.rotation.y = Math.PI;
      exhaust.position.z = -1.55;
      engGroup.add(exhaust);

      engGroup.position.set(x, y, z);
      return engGroup;
    }

    plane.add(createEngine(-4.2, -1.05, 1.4));
    plane.add(createEngine(4.2, -1.05, 1.4));

    // 【B774 急改造パーツ】機体背面の大型レドーム＆観測アンテナ群
    const radome = new THREE.Mesh(new THREE.SphereGeometry(0.95, 20, 12), wingMat);
    radome.scale.set(0.8, 0.35, 2.2);
    radome.position.set(0, 1.15, 1.5);
    plane.add(radome);

    const antenna1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.8, 0.3), darkMetalMat);
    antenna1.position.set(0, 1.4, -3.5);
    plane.add(antenna1);

    // 翼端灯（左：赤、右：緑）
    const leftNav = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff1111 }));
    leftNav.position.set(-12.3, 0.35, -2.8);
    const rightNav = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshBasicMaterial({ color: 0x11ff44 }));
    rightNav.position.set(12.3, 0.35, -2.8);
    plane.add(leftNav, rightNav);

    plane.position.y = 5.2;
    scene.add(plane);

    // 5. 滑らかで光沢のある夜間海面（高分割メッシュ）
    const seaGeo = new THREE.PlaneGeometry(260, 260, 110, 110);
    seaGeo.rotateX(-Math.PI / 2);
    const seaMat = new THREE.MeshPhysicalMaterial({
      color: 0x050e1a,
      roughness: 0.14,
      metalness: 0.85,
      clearcoat: 0.9,
      clearcoatRoughness: 0.15,
      flatShading: false
    });
    const sea = new THREE.Mesh(seaGeo, seaMat);
    sea.receiveShadow = true;
    scene.add(sea);

    // 6. 低空飛行の風圧による水しぶきパーティクル
    const sprayCount = 450;
    const sprayGeo = new THREE.BufferGeometry();
    const sprayPositions = new Float32Array(sprayCount * 3);
    for (let i = 0; i < sprayCount; i++) {
      sprayPositions[i * 3] = (Math.random() - 0.5) * 26;
      sprayPositions[i * 3 + 1] = Math.random() * 2.2;
      sprayPositions[i * 3 + 2] = (Math.random() - 0.5) * 80;
    }
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPositions, 3));
    const sprayMat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.25, transparent: true, opacity: 0.45 });
    const spray = new THREE.Points(sprayGeo, sprayMat);
    scene.add(spray);

    // 7. カメラ視点切替（タップで3種類の特撮アングルへ）
    let camMode = 0;
    const camLabels = [
      "CAM 01: 海面低空ローアングル（画面タップで視点切替）",
      "CAM 02: 機首前方・誘導作戦アングル（画面タップで視点切替）",
      "CAM 03: 後方追従・エンジン排気ビュー（画面タップで視点切替）"
    ];

    window.addEventListener('pointerdown', (e) => {
      if (e.target.id === 'toggle-ui') return;
      camMode = (camMode + 1) % 3;
      document.getElementById('cam-label').textContent = camLabels[camMode];
    });

    function toggleHud(e) {
      e.stopPropagation();
      const hud = document.getElementById('hud');
      hud.style.opacity = hud.style.opacity === '0' ? '1' : '0';
    }

    // 8. メインアニメーションループ
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.035;

      // 複雑なうねりを持つ波の計算
      const pos = seaGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const w1 = Math.sin(x * 0.14 + time * 1.6) * 0.55;
        const w2 = Math.cos(z * 0.18 + time * 3.8) * 0.65;
        const w3 = Math.sin((x + z) * 0.35 + time * 5.0) * 0.2;
        pos.setY(i, w1 + w2 + w3);
      }
      pos.needsUpdate = true;
      seaGeo.computeVertexNormals(); // 滑らかな反射のための法線再計算

      // 水しぶきを後方へ高速移動させる
      const sPos = sprayGeo.attributes.position;
      for (let i = 0; i < sprayCount; i++) {
        let z = sPos.getZ(i) - 1.6;
        if (z < -40) z = 40;
        sPos.setZ(i, z);
      }
      sPos.needsUpdate = true;

      // タービンファン高速回転
      fans.forEach(f => f.rotation.z += 0.45);

      // 翼端灯ストロボ点滅
      const blink = Math.sin(time * 8) > 0.3;
      leftNav.visible = blink;
      rightNav.visible = blink;

      // 機体の気流によるリアルな揺れ
      plane.position.y = 5.0 + Math.sin(time * 1.4) * 0.35;
      plane.rotation.z = Math.sin(time * 1.1) * 0.07;
      plane.rotation.x = Math.cos(time * 1.4) * 0.025;

      // カメラ位置の更新＋実写特撮風の微細な手ブレ
      const shakeX = Math.sin(time * 11) * 0.04;
      const shakeY = Math.cos(time * 13) * 0.04;

      if (camMode === 0) {
        // 海面ギリギリから見上げる巨大感アングル
        camera.position.set(15 + shakeX, 1.6 + shakeY, 16);
        camera.lookAt(plane.position.x, plane.position.y + 0.5, plane.position.z + 1);
      } else if (camMode === 1) {
        // 前方斜め上からの迫力アングル
        camera.position.set(-11 + shakeX, 7.5 + shakeY, 21);
        camera.lookAt(plane.position);
      } else {
        // 後方からの追従カメラ
        camera.position.set(5 + shakeX, 6.8 + shakeY, -21);
        camera.lookAt(plane.position.x, plane.position.y - 0.5, plane.position.z + 6);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
